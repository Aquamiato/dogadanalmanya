<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffeedd"/>
      <stop offset="1" stop-color="#fff6f0"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" x2="1">
      <stop offset="0" stop-color="#e6cfae"/>
      <stop offset="1" stop-color="#f7e5cf"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)" />
  <!-- distant hills -->
  <g transform="translate(0,200)">
    <path d="M0,520 C200,380 420,420 700,520 C980,620 1200,500 1600,560 L1600,700 L0,700 Z" fill="#f4e0c8" />
    <path d="M0,560 C220,420 480,460 760,560 C1040,660 1280,560 1600,600 L1600,700 L0,700 Z" fill="#ecd5b4" opacity="0.9" />
  </g>
  <!-- foreground meadow -->
  <rect x="0" y="620" width="1600" height="280" fill="#fff1e0" />
  <!-- stylized sun -->
  <g transform="translate(1200,140)">
    <circle r="60" fill="#ffd08a" />
    <circle r="40" fill="#fff1c9" />
  </g>
  <!-- bee icons -->
  <g transform="translate(420,320)">
    <ellipse cx="0" cy="0" rx="18" ry="12" fill="#c26900" />
    <path d="M-8,-2 C0,-8 8,-8 16,-2" stroke="#000" stroke-width="2" fill="none" opacity="0.6" />
    <path d="M-8,2 C0,8 8,8 16,2" stroke="#000" stroke-width="2" fill="none" opacity="0.6" />
  </g>
  <g transform="translate(960,380) scale(0.9)">
    <ellipse cx="0" cy="0" rx="20" ry="13" fill="#c26900" />
    <path d="M-9,-3 C0,-9 9,-9 17,-3" stroke="#000" stroke-width="2" fill="none" opacity="0.6" />
  </g>
  <!-- decorative jar of honey -->
  <g transform="translate(260,520) scale(1.3)">
    <rect x="0" y="0" width="160" height="160" rx="20" fill="#ffdca3" stroke="#e2a64a" stroke-width="3" />
    <ellipse cx="80" cy="10" rx="48" ry="10" fill="#f3b04a"/>
    <text x="40" y="100" font-family="Arial" font-size="22" fill="#8b4b00">Doğal Bal</text>
  </g>
  <!-- title area as part of image for nicer fallback -->
  <text x="360" y="220" font-family="Merriweather, serif" font-size="58" fill="#2f2f2f">Doğadan Almanya</text>
  <text x="360" y="270" font-family="Inter, sans-serif" font-size="22" fill="#6b6b6b">Doğal bal ve lezzetler — Almanya'ya</text>
</svg>
